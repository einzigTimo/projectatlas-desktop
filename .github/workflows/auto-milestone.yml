# Purpose: Assign the milestone of a referenced issue to the PR automatically.
# This ensures PRs targeting main/dev always have a milestone set, satisfying
# the "Issue reference check" gate in ci.yml.

name: 02-Auto-Milestone

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, edited, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to assign a milestone to"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  set-milestone:
    name: set-milestone
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Assign milestone from referenced issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PR_MILESTONE="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.milestone.number // ""')"
          if [[ -n "$PR_MILESTONE" ]]; then
            echo "PR already has milestone $PR_MILESTONE – nothing to do."
            exit 0
          fi

          PR_TITLE="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.title // ""')"
          PR_BODY="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""')"
          text="$PR_TITLE $PR_BODY"

          # Extract all #NNN references from title + body, excluding the PR itself
          issue_refs=$(grep -oP '(?<!\w)#\K[0-9]+' <<< "$text" | sort -un | grep -xv "$PR_NUMBER")
          if [[ -z "$issue_refs" ]]; then
            echo "No issue references found in PR title/body."
            exit 0
          fi

          for num in $issue_refs; do
            api_out=$(gh api "repos/$REPO/issues/$num" --jq '.milestone.number // ""' 2>&1) && api_ok=true || api_ok=false
            if [[ "$api_ok" == "false" ]]; then
              if echo "$api_out" | grep -q "HTTP 404\|Not Found"; then
                echo "Issue/PR #$num not found, skipping."
              else
                echo "Warning: unexpected error for #$num: $api_out" >&2
              fi
              continue
            fi
            milestone="$api_out"
            if [[ -n "$milestone" ]]; then
              echo "Found milestone $milestone from issue/PR #$num – assigning to PR #$PR_NUMBER."
              gh api --method PATCH "repos/$REPO/pulls/$PR_NUMBER" \
                --input - <<< "{\"milestone\": $milestone}"
              echo "Milestone set."
              exit 0
            fi
          done

          echo "No milestone found in any referenced issue/PR."

          # Fallback: create or reuse a milestone based on the current crate version.
          VERSION="$(grep -m1 '^version' crates/projectatlas-desktop/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          MILESTONE_TITLE="v${VERSION}"
          echo "Falling back to version-based milestone: $MILESTONE_TITLE"

          # Try to find an existing open milestone with that title.
          existing=$(gh api "repos/$REPO/milestones" --jq \
            ".[] | select(.title == \"$MILESTONE_TITLE\") | .number" 2>/dev/null | head -1)

          if [[ -n "$existing" ]]; then
            echo "Reusing existing milestone #$existing ($MILESTONE_TITLE)."
            milestone="$existing"
          else
            echo "Creating new milestone $MILESTONE_TITLE."
            milestone=$(gh api --method POST "repos/$REPO/milestones" \
              --field title="$MILESTONE_TITLE" --jq '.number')
          fi

          gh api --method PATCH "repos/$REPO/pulls/$PR_NUMBER" \
            --input - <<< "{\"milestone\": $milestone}"
          echo "Milestone $milestone ($MILESTONE_TITLE) set on PR #$PR_NUMBER."
