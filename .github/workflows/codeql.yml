name: CodeQL
on:
  push: { branches: [ "main" ] }
  pull_request: { branches: [ "main" ] }
# Kostenbremse (07.09.2026): Der PR-Trigger bleibt bewusst stehen -- `analyze`
# ist im Ruleset "protect-main" ein PFLICHT-Check. Wuerde er bei Pull Requests
# nicht mehr laufen, bliebe jeder PR dauerhaft blockiert. Gespart wird deshalb
# ueber cancel-in-progress statt ueber weniger Ausloeser.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions: { actions: read, contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with: { languages: rust }
      - uses: github/codeql-action/autobuild@6f5948dfacef28e207b48d0905cf90c03365536d # v3
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
