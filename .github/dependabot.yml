version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "main"
    groups:
      all-cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    schedule: { interval: "weekly" }
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule: { interval: "weekly" }
